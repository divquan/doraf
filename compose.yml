name: doraf

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: doraf
      POSTGRES_PASSWORD: doraf
      POSTGRES_USER: doraf
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doraf -d doraf"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres-data:
